<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>10 · Feature Spotlight: Operations</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Noto+Sans+KR:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
    <div class="slide-container" data-screen-label="10 Feature Spotlight Operations">

        <!-- Tracker & Header Title -->
        <div data-object="true" data-object-type="textbox"
            style="position:absolute;left:120px;top:100px;width:1680px;z-index:10;">
            <div class="header-tracker">10 / SYSTEM OPERATIONS</div>
            <div class="header-title">기능 하이라이트 ② — 운영 & 관리</div>
            <div class="header-rule"></div>
        </div>

        <!-- 3 Horizontal Spotlight Cards with mirrored staggered rotation angles -->

        <!-- Card A (1.5deg) -->
        <div data-object="true" data-object-type="shape" class="glass-card"
            style="position:absolute;left:100px;top:220px;width:540px;height:730px;transform:rotate(1.5deg);z-index:5;display:flex;flex-direction:column;justify-content:flex-start;padding:24px;gap:20px;">
            <div style="font-size:32px;font-weight:900;color:var(--accent-mint);display:flex;align-items:center;">
                <span style="font-family:var(--font-mono);margin-right:12px;">04</span> 마이페이지
            </div>
            
            <!-- Screenshot Container -->
            <div style="width:100%;flex:1;background:#161A18;border:1px solid rgba(61, 242, 148, 0.15);border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;">
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;">
                    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(61, 242, 148, 0.01) 1px, transparent 1px);background-size:20px 20px;"></div>
                    <div style="font-family:var(--font-mono);font-size:18px;color:var(--accent-mint);text-align:center;line-height:1.6;z-index:2;">
                        [User Profile Node]<br>
                        <span style="font-size:28px;font-weight:700;color:#FFFFFF;">Unified Profile</span><br>
                        Activity Aggregations Active
                    </div>
                </div>
                <!-- Fallback screenshot overlay -->
                <img src="../assets/screenshot_mypage.png" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:6px;display:none;z-index:10;" onload="this.style.display='block'; this.previousElementSibling.style.display='none';" alt="마이페이지">
            </div>
        </div>

        <!-- Card B (-2deg) -->
        <div data-object="true" data-object-type="shape" class="glass-card"
            style="position:absolute;left:690px;top:220px;width:540px;height:730px;transform:rotate(-2deg);z-index:5;display:flex;flex-direction:column;justify-content:flex-start;padding:24px;gap:20px;border-color:var(--accent-coral);">
            <div style="font-size:32px;font-weight:900;color:var(--accent-coral);display:flex;align-items:center;">
                <span style="font-family:var(--font-mono);margin-right:12px;">05</span> 관리자 대시보드
            </div>
            
            <div style="width:100%;flex:1;background:#161A18;border:1px solid rgba(255, 138, 101, 0.3);border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;">
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;">
                    <div style="position:absolute;inset:0;background:radial-gradient(circle at center, rgba(255, 138, 101, 0.1) 0%, transparent 80%);"></div>
                    <div style="font-family:var(--font-mono);font-size:18px;color:var(--accent-coral);text-align:center;line-height:1.6;z-index:2;">
                        [Admin Control Console]<br>
                        <span style="font-size:26px;font-weight:700;color:#FFFFFF;">Recharts Analytics ×3</span><br>
                        Role & Post Ban Enabled
                    </div>
                </div>
                <!-- Fallback screenshot overlay -->
                <img src="../assets/screenshot_admin.png" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:6px;display:none;z-index:10;" onload="this.style.display='block'; this.previousElementSibling.style.display='none';" alt="관리자 대시보드">
            </div>
        </div>

        <!-- Card C (2.5deg) -->
        <div data-object="true" data-object-type="shape" class="glass-card"
            style="position:absolute;left:1280px;top:220px;width:540px;height:730px;transform:rotate(2.5deg);z-index:5;display:flex;flex-direction:column;justify-content:flex-start;padding:24px;gap:20px;">
            <div style="font-size:32px;font-weight:900;color:var(--accent-mint);display:flex;align-items:center;">
                <span style="font-family:var(--font-mono);margin-right:12px;">06</span> 인증 및 보안 정책
            </div>
            
            <div style="width:100%;flex:1;background:#161A18;border:1px solid rgba(61, 242, 148, 0.15);border-radius:8px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;">
                <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;">
                    <div style="position:absolute;inset:0;background-image:linear-gradient(rgba(61, 242, 148, 0.015) 1px, transparent 1px);background-size:20px 20px;"></div>
                    <div style="font-family:var(--font-mono);font-size:18px;color:var(--accent-mint);text-align:center;line-height:1.6;z-index:2;">
                        [Identity Service Engine]<br>
                        <span style="font-size:24px;font-weight:700;color:#FFFFFF;">JWT Security Protocol</span><br>
                        Steam / Riot OAuth Integration
                    </div>
                </div>
                <!-- Fallback screenshot overlay -->
                <img src="../assets/screenshot_security.png" style="position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:6px;display:none;z-index:10;" onload="this.style.display='block'; this.previousElementSibling.style.display='none';" alt="인증 및 보안 정책">
            </div>
        </div>

    </div>
</body>

</html>
