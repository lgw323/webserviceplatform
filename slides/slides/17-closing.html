<!doctype html>
<html lang="ko">

<head>
    <meta charset="utf-8">
    <title>17 · Closing & Q&A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;700;900&family=Noto+Sans+KR:wght@300;400;700;900&family=JetBrains+Mono:wght@400;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
    <div class="slide-container" data-screen-label="17 Closing">

        <!-- Background Isometric Scatter Slides Representation (Z-Index: 1, Opacity 0.15) -->
        <div data-object="true" data-object-type="shape"
            style="position:absolute;left:0;top:0;width:1920px;height:1080px;z-index:1;perspective:1500px;overflow:hidden;pointer-events:none;">
            <!-- Large rotated plates mimicking scatter slides -->
            <div
                style="position:absolute;left:100px;top:-100px;width:600px;height:450px;background:var(--card-bg);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:12px;transform:rotateX(45deg) rotateY(-15deg);opacity:0.12;">
            </div>
            <div
                style="position:absolute;right:100px;top:50px;width:600px;height:450px;background:var(--card-bg);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:12px;transform:rotateX(45deg) rotateY(-15deg);opacity:0.1;">
            </div>
            <div
                style="position:absolute;left:-100px;bottom:50px;width:600px;height:450px;background:var(--card-bg);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:12px;transform:rotateX(45deg) rotateY(-15deg);opacity:0.12;">
            </div>
            <div
                style="position:absolute;right:-150px;bottom:-100px;width:600px;height:450px;background:var(--card-bg);border:var(--card-border);box-shadow:var(--card-shadow);border-radius:12px;transform:rotateX(45deg) rotateY(-15deg);opacity:0.08;">
            </div>
        </div>

        <!-- Background Decorative Laser Beam Grid -->
        <svg data-object="true" data-object-type="shape"
            style="position:absolute;inset:0;width:1920px;height:1080px;pointer-events:none;z-index:2;"
            viewBox="0 0 1920 1080" fill="none">
            <path d="M960 540 L1920 100" stroke="rgba(61, 242, 148, 0.04)" stroke-width="2" />
            <path d="M960 540 L0 1000" stroke="rgba(61, 242, 148, 0.04)" stroke-width="2" />
            <path d="M960 540 L1920 900" stroke="rgba(61, 242, 148, 0.04)" stroke-width="2" />
        </svg>

        <!-- Giant Thank You! Typography (Centered with asymmetric offset visually) -->
        <div data-object="true" data-object-type="textbox"
            style="position:absolute;left:120px;top:320px;width:1680px;text-align:center;z-index:10;">
            <h1
                style="font-size:160px;font-weight:900;letter-spacing:-0.05em;margin:0;color:var(--accent-mint);line-height:1;text-shadow:0 20px 50px rgba(61, 242, 148, 0.3);">
                THANK YOU!
            </h1>

            <div style="font-size:38px;font-weight:700;color:#FFFFFF;margin-top:40px;letter-spacing:-0.02em;">
                SYNCRIG — 가중 정규화 기반 게이밍 하드웨어 최적화 플랫폼
            </div>

            <div
                style="font-family:var(--font-mono);font-size:24px;color:rgba(61, 242, 148, 0.8);margin-top:20px;letter-spacing:0.2em;text-transform:uppercase;">
                Q&amp;A Session
            </div>
        </div>

        <!-- Footer Information -->
        <div data-object="true" data-object-type="textbox"
            style="position:absolute;left:120px;top:900px;width:1680px;text-align:center;font-family:var(--font-mono);font-size:16px;color:#606B67;letter-spacing:0.1em;z-index:10;">
            SYNCRIG Platform Presentation &middot; Technical Review Session Completed
        </div>

    </div>
</body>

</html>
